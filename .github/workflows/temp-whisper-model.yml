name: Temporary Whisper Model Bridge

on:
  pull_request:
    paths:
      - .github/temp-whisper-trigger.txt

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download Linux wheels for Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/wheels
          python -m pip download --only-binary=:all: faster-whisper -d package/wheels
          python --version
          find package/wheels -type f -printf '%f %s\n' | sort
          du -sh package/wheels

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-linux-wheels-py313
          path: package/wheels
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
