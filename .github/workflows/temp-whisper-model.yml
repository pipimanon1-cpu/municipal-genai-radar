name: Temporary Whisper Model Bridge

on:
  pull_request:
    paths:
      - .github/temp-whisper-trigger.txt

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified multilingual Whisper model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 5 --retry-delay 2 \
            -o model/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  model/ggml-large-v3-turbo-q5_0.bin" | sha256sum -c -
          test "$(stat -c%s model/ggml-large-v3-turbo-q5_0.bin)" = "574041195"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0-verified
          path: model/ggml-large-v3-turbo-q5_0.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
