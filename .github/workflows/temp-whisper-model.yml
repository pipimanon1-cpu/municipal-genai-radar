name: Temporary Whisper Model Bridge

on:
  pull_request:
    paths:
      - .github/temp-whisper-trigger.txt

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download and split faster-whisper large-v3-turbo model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub
          mkdir -p package/model package/parts
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='mobiuslabsgmbh/faster-whisper-large-v3-turbo',
              local_dir='package/model',
              local_dir_use_symlinks=False,
          )
          PY
          find package/model -type f -printf '%P %s\n' | sort
          du -sh package/model
          tar -cf package/model.tar -C package/model .
          split -b 350000000 -d -a 1 package/model.tar package/parts/model.part
          find package/parts -type f -printf '%f %s\n' | sort

      - name: Upload model part 0
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-turbo-part0
          path: package/parts/model.part0
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload model part 1
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-turbo-part1
          path: package/parts/model.part1
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload model part 2
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-turbo-part2
          path: package/parts/model.part2
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload model part 3
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-turbo-part3
          path: package/parts/model.part3
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload model part 4
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-turbo-part4
          path: package/parts/model.part4
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload model part 5
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-turbo-part5
          path: package/parts/model.part5
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
