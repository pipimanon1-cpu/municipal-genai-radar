name: Temporary Whisper Model Bridge

on:
  pull_request:
    paths:
      - .github/temp-whisper-trigger.txt

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified multilingual Whisper model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 5 --retry-delay 2 \
            -o model/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          echo "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  model/ggml-base-q5_1.bin" | sha256sum -c -
          test "$(stat -c%s model/ggml-base-q5_1.bin)" = "59707625"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1-verified
          path: model/ggml-base-q5_1.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
